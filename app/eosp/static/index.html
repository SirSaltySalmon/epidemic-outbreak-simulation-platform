<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EOSP — MV Hondius Outbreak Intelligence</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/drawer.css" />
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" defer></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js" defer></script>
  <!-- Plotly basic (scatter + histogram; ~1MB) -->
  <script src="https://cdn.plot.ly/plotly-basic-2.35.2.min.js" defer></script>
</head>
<body>

  <!-- ── Topbar ── -->
  <header class="topbar" role="banner">
    <div class="topbar-brand">
      <p class="eyebrow">Epidemic Outbreak Simulation Platform</p>
      <h1>MV Hondius · Andes Hantavirus Outbreak</h1>
    </div>
    <div id="topbar-status-wrap" class="topbar-status-wrap" aria-live="polite">
      <span id="topbar-status-updated" class="topbar-status-line">Loading…</span>
      <span id="topbar-status-checked" class="topbar-status-sub"></span>
    </div>
    <span id="version-badge" class="version-badge" title="Model version"></span>
    <div id="clerk-user-wrap" class="clerk-user-wrap" aria-live="polite"></div>
    <button class="btn-console" id="btn-open-drawer" type="button" aria-haspopup="dialog" hidden>
      Console
    </button>
  </header>

  <!-- ── Main dashboard ── -->
  <main class="page-body" id="page-body">

    <!-- KPI strip -->
    <section class="kpi-strip" aria-label="Key outbreak metrics">
      <article class="kpi-card">
        <div class="kpi-label">
          Recorded Cases
          <span class="tip-icon" id="kpi-recorded-tip" data-tip="Loading… Person-equivalent totals: individual rows plus ingested cohort or summary observations (each cohort row counts as cohort_size confirmed/suspected persons)." aria-label="Recorded cases">?</span>
        </div>
        <div class="kpi-value" id="kpi-confirmed">—</div>
        <div class="kpi-sub" id="kpi-confirmed-sub"></div>
      </article>
      <article class="kpi-card">
        <div class="kpi-label">
          Deaths · CFR
          <span class="tip-icon" data-tip="Confirmed number of deaths." aria-label="Deaths count">?</span>
        </div>
        <div class="kpi-value" id="kpi-deaths">—</div>
        <div class="kpi-sub" id="kpi-deaths-sub"></div>
      </article>
      <article class="kpi-card">
        <div class="kpi-label">
          14-day Forecast · Cases
          <span class="tip-icon" data-tip="Forecasted cumulative infections from the stochastic model (median and uncertainty)." aria-label="Model forecast cases">?</span>
        </div>
        <div class="kpi-value" id="kpi-forecast">—</div>
        <div class="kpi-sub" id="kpi-forecast-sub"></div>
      </article>
      <article class="kpi-card">
        <div class="kpi-label">
          14-day Forecast · Deaths
          <span class="tip-icon" data-tip="Forecasted cumulative deaths from the same baseline scenario (median and uncertainty)." aria-label="Model forecast deaths">?</span>
        </div>
        <div class="kpi-value" id="kpi-forecast-deaths">—</div>
        <div class="kpi-sub" id="kpi-forecast-deaths-sub"></div>
      </article>
    </section>

    <!-- World map -->
    <section class="map-panel" aria-label="Global outbreak and risk map">
        <div id="world-map"></div>
        <p class="map-legend" id="map-legend" aria-live="polite"></p>
    </section>

    <!-- Forecast chart + scenario sidebar -->
    <div class="workspace">
      <div class="chart-panel">
        <div class="panel-heading">
          <h2>Baseline Forecast · Cumulative cases · 14-day horizon</h2>
          <span class="freshness" id="chart-freshness"></span>
        </div>
        <div id="forecast-chart"></div>
        <p class="chart-explanation" id="chart-explanation" aria-live="polite"></p>
      </div>
      <aside class="scenario-sidebar" id="scenario-sidebar" aria-label="Scenario comparison">
        <!-- populated by scenarios.js -->
      </aside>
    </div>

    <!-- Case registry -->
    <section class="cases-section" aria-label="Recorded case lines">
      <div class="cases-panel chart-panel">
        <div class="panel-heading">
          <h2>Recorded case lines</h2>
          <span class="freshness" id="cases-list-count"></span>
        </div>
        <p class="cases-empty" id="cases-empty" hidden></p>
        <div class="cases-scroll" id="cases-scroll" role="list" aria-label="Case rows from the database"></div>
      </div>
    </section>

  </main>

  <!-- ── Researcher Drawer ── -->
  <div class="drawer-overlay" id="drawer-overlay" role="dialog" aria-modal="true" aria-label="Researcher Console">
    <div class="drawer" id="drawer">
      <div class="drawer-header">
        <h2>⚗ Researcher Console</h2>
        <button class="drawer-close" id="btn-close-drawer" type="button" aria-label="Close researcher console">✕</button>
      </div>
      <div class="drawer-body" id="drawer-body">
        <!-- populated by drawer.js -->
      </div>
    </div>
  </div>

  <!-- JS modules (type=module keeps them scoped; defer on CDN scripts fires first) -->
  <script type="module" src="/js/main.js"></script>

</body>
</html>
