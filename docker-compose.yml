services:
  postgres:
    image: postgres:16
    container_name: eosp-postgres
    environment:
      POSTGRES_DB: eosp
      POSTGRES_USER: eosp
      POSTGRES_PASSWORD: eosp_dev_password
    ports:
      - "5432:5432"
    volumes:
      - eosp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eosp -d eosp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: eosp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eosp_postgres_data:
