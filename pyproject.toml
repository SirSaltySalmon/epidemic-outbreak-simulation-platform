[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eosp"
version = "0.1.0"
description = "Epidemic Outbreak Simulation Platform MVP"
requires-python = ">=3.11"
dependencies = [
    "pyjwt[crypto]>=2.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "upstash-redis>=1.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]
mobility = [
    "pyarrow>=15.0",
]
simulation = [
    "numpy>=1.26",
    "scipy>=1.13",
    "networkx>=3.2",
    "numpyro>=0.15.0",
    "jax[cpu]>=0.4.30",
    "arviz>=0.18.0",
]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
markers = [
    "integration: tests that touch network / external services (opt-in)",
    "slow: longer MCMC or forecast runs (opt-in)",
]

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]

# Runtime JSON under app/eosp/data (scenarios, spawn profile, geo refs, etc.) must ship in the wheel/Docker image.
[tool.setuptools.package-data]
eosp = [
    "data/*.json",
    "data/bundles/*.json",
]

[project.scripts]
eosp-researcher-gui = "eosp.tools.researcher_gui:main"

[tool.vercel]
# Entrypoint imports must not pull `.[simulation]` (numpy/jax/networkx/…): keep installs to `pip install .`
entrypoint = "app.eosp.main:app"